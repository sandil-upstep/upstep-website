<svg width="34" height="68" viewBox="0 0 34 68" fill="none" xmlns="http://www.w3.org/2000/svg">
<style>
  .wheel { animation: wheel 1.8s ease-in-out infinite; }
  .chev  { animation: chev 1.8s ease-in-out infinite; opacity: 0.15; }
  .c1 { animation-delay: 0s; }
  .c2 { animation-delay: 0.2s; }
  .c3 { animation-delay: 0.4s; }

  @keyframes wheel {
    0%   { transform: translateY(0);   opacity: 1; }
    50%  { transform: translateY(5px); opacity: 0; }
    51%  { transform: translateY(0);   opacity: 0; }
    100% { transform: translateY(0);   opacity: 1; }
  }
  @keyframes chev {
    0%, 100% { opacity: 0.15; transform: translateY(-2px); }
    30%      { opacity: 1;    transform: translateY(0); }
    60%      { opacity: 0.15; transform: translateY(2px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .wheel, .chev { animation: none; }
    .c1 { opacity: 0.3; } .c2 { opacity: 0.6; } .c3 { opacity: 1; }
  }
</style>
<rect x="0.5" y="0.5" width="33" height="42" rx="15.5" fill="white" fill-opacity="0.1" stroke="black"/>
<rect class="wheel" x="15.5" y="5.5" width="3" height="10" rx="1.5" stroke="black"/>
<path class="chev c1" d="M10 46L17 53L24 46" stroke="black" stroke-linecap="round"/>
<path class="chev c2" d="M10 53L17 60L24 53" stroke="black" stroke-linecap="round"/>
<path class="chev c3" d="M10 60L17 67L24 60" stroke="black" stroke-linecap="round"/>
</svg>
